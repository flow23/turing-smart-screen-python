STATS:
  CUSTOM:
    INTERVAL: 5   # global refresh interval
    ProxmoxNodeCPUUsageSensor:
      TEXT:
        SHOW: true
        X: 175
        Y: 10
        # Text sensors may vary in size and create "ghosting" effects where old value stay displayed under the new one.
        # To avoid this use one of these 2 methods (or both):
        #   - either use a monospaced font (fonts with "mono" in name, see res/fonts/ for available fonts)
        #   - or force a static width/height for the text field. Be sure to have enough space for the longest value that can be displayed (e.g. "100%" for a percentage)
        WIDTH: 144
        HEIGHT: 57
        FONT: BoutiqueBitmap9x9/BoutiqueBitmap9x9_Square_Dot.ttf
        FONT_SIZE: 76
        FONT_COLOR: 255,255,255
        #BACKGROUND_COLOR: 50, 50, 50
        BACKGROUND_IMAGE: background2.png
        #ALIGN: center
        ANCHOR: rb
      LINE_GRAPH:
        SHOW: true
        X: 330
        Y: 10
        WIDTH: 310
        HEIGHT: 57
        MIN_VALUE: 0
        MAX_VALUE: 100
        HISTORY_SIZE: 25
        AUTOSCALE: False
        LINE_COLOR: 255,255,255
        LINE_WIDTH: 4
        BACKGROUND_COLOR: 0, 0, 0
        #BACKGROUND_IMAGE: background2.png
    ProxmoxNodeMemoryUsageSensor:
      TEXT:
        SHOW: true
        X: 175
        Y: 78
        WIDTH: 144
        HEIGHT: 57
        FONT: BoutiqueBitmap9x9/BoutiqueBitmap9x9_Square_Dot.ttf
        FONT_SIZE: 76
        FONT_COLOR: 255,255,255
        #BACKGROUND_COLOR: 50, 50, 50
        BACKGROUND_IMAGE: background2.png
        #ALIGN: center
        ANCHOR: rb
      LINE_GRAPH:
        SHOW: true
        X: 330
        Y: 78
        WIDTH: 310
        HEIGHT: 57
        MIN_VALUE: 0
        MAX_VALUE: 100
        HISTORY_SIZE: 25
        AUTOSCALE: False
        LINE_COLOR: 255,255,255
        LINE_WIDTH: 4
        BACKGROUND_COLOR: 0, 0, 0
        #BACKGROUND_IMAGE: background2.png
    ProxmoxNodeDiskUsageSensor:
      TEXT:
        SHOW: True
        X: 175
        Y: 146
        WIDTH: 144
        HEIGHT: 57
        FONT: BoutiqueBitmap9x9/BoutiqueBitmap9x9_Square_Dot.ttf
        FONT_SIZE: 76
        FONT_COLOR: 255,255,255
        BACKGROUND_COLOR: 50, 50, 50
        #BACKGROUND_IMAGE: background2.png
        #ALIGN: center
        ANCHOR: rb
    ProxmoxNodeUptimeSensor:
      TEXT:
        SHOW: TRUE
        X: 175
        Y: 350
        # Text sensors may vary in size and create "ghosting" effects where old value stay displayed under the new one.
        # To avoid this use one of these 2 methods (or both):
        #   - either use a monospaced font (fonts with "mono" in name, see res/fonts/ for available fonts)
        #   - or force a static width/height for the text field. Be sure to have enough space for the longest value that can be displayed (e.g. "100%" for a percentage)
        WIDTH: 465   # Uncomment to force a static width
        HEIGHT: 57   # Uncomment to force static height
        FONT: BoutiqueBitmap9x9/BoutiqueBitmap9x9_Square_Dot.ttf
        FONT_SIZE: 76
        FONT_COLOR: 255,255,255
        BACKGROUND_COLOR: 50, 50, 50
        #BACKGROUND_IMAGE: background2.png
        #ALIGN: right
        #ANCHOR: lt
        ANCHOR: rm
  CPU:
    PERCENTAGE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
