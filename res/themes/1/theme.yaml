              FONT_SIZE: 76
              FONT_COLOR: 255,255,255
              BACKGROUND_COLOR: 50, 50, 50
              #BACKGROUND_IMAGE: background2.png
              #ALIGN: center
              ANCHOR: rb
  NET:
    INTERVAL: 5
    ETH:
