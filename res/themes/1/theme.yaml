          SHOW: true
          X: 810
          Y: 214
          WIDTH: 465
          HEIGHT: 57
          FONT: BoutiqueBitmap9x9/BoutiqueBitmap9x9_Square_Dot.ttf
          FONT_SIZE: 76
          FONT_COLOR: 255,255,255
          BACKGROUND_COLOR: 50, 50, 50
          #BACKGROUND_IMAGE: background2.png
          #ALIGN: right
          ANCHOR: rm
